<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Everything Markdown — local-first Markdown workspace for Firefox">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f6f9"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1a2b" flood-opacity="0.14"/>
    </filter>
    <filter id="glyph" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0b1a2b" flood-opacity="0.10"/>
    </filter>
    <clipPath id="badgeClip">
      <rect x="72" y="90" width="140" height="140" rx="40"/>
    </clipPath>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="1278" height="318" rx="22" fill="url(#bg)" stroke="#e4e8ee"/>
  <rect x="1" y="1" width="1278" height="318" rx="22" fill="none" stroke="#1a73e8" stroke-opacity="0.08"/>

  <!-- brand badge: mirrors .brand-icon (28px box, 8px radius, #e2e8f0 border) scaled x5 -->
  <g filter="url(#soft)">
    <rect x="72" y="90" width="140" height="140" rx="40" fill="url(#badge)" stroke="#e2e8f0" stroke-width="5"/>
  </g>

  <!-- emoji stacked in the corners, matching .brand-emoji-1/2/3; clipped to the badge -->
  <g clip-path="url(#badgeClip)" font-size="52" filter="url(#glyph)" text-anchor="middle" style="dominant-baseline:central" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">
    <text x="159" y="184">✨</text>
    <text x="142" y="128">🗂️</text>
    <text x="125" y="184">📝</text>
  </g>

  <!-- wordmark -->
  <text x="250" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#1f2328">Everything Markdown</text>
  <text x="252" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" fill="#57606a">Local-first Markdown workspace for Firefox — one-click Gemini conversation export</text>

  <!-- chips -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#57606a">
    <rect x="252" y="224" width="118" height="30" rx="15" fill="#ffffff" stroke="#d0d7de"/>
    <text x="311" y="244" text-anchor="middle">Manifest V3</text>
    <rect x="380" y="224" width="104" height="30" rx="15" fill="#ffffff" stroke="#d0d7de"/>
    <text x="432" y="244" text-anchor="middle">Local-first</text>
    <rect x="494" y="224" width="118" height="30" rx="15" fill="#ffffff" stroke="#d0d7de"/>
    <text x="553" y="244" text-anchor="middle">No telemetry</text>
  </g>
</svg>
