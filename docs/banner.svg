<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Everything Markdown — local-first Markdown workspace for Firefox">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f6f9"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eaeef4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1a2b" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="1278" height="318" rx="22" fill="url(#bg)" stroke="#e4e8ee"/>
  <rect x="1" y="1" width="1278" height="318" rx="22" fill="none" stroke="#1a73e8" stroke-opacity="0.08"/>

  <!-- brand badge -->
  <g filter="url(#soft)">
    <rect x="72" y="80" width="160" height="160" rx="30" fill="url(#badge)" stroke="#e2e8f0"/>
  </g>

  <!-- folder (back) -->
  <g>
    <path d="M96 150 h30 l12 -12 h40 a10 10 0 0 1 10 10 v58 a10 10 0 0 1 -10 10 h-82 a10 10 0 0 1 -10 -10 v-46 a10 10 0 0 1 10 -10 z"
          fill="#dbe9fb" stroke="#1a73e8" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- document (front) -->
  <g>
    <path d="M132 104 h44 l24 24 v72 a8 8 0 0 1 -8 8 h-60 a8 8 0 0 1 -8 -8 v-88 a8 8 0 0 1 8 -8 z"
          fill="#ffffff" stroke="#c8d0da" stroke-width="2"/>
    <path d="M176 104 l24 24 h-24 z" fill="#eef2f7"/>
    <rect x="136" y="146" width="52" height="6" rx="3" fill="#c9cfd8"/>
    <rect x="136" y="160" width="52" height="6" rx="3" fill="#c9cfd8"/>
    <rect x="136" y="174" width="34" height="6" rx="3" fill="#d8dde4"/>
  </g>

  <!-- sparkle -->
  <g>
    <path d="M204 196 c3 -12 4 -13 7 -1 c1 4 2 5 6 6 c11 3 11 4 0 7 c-4 1 -5 2 -6 6 c-3 12 -4 12 -7 0 c-1 -4 -2 -5 -6 -6 c-11 -3 -11 -4 0 -7 c4 -1 5 -2 6 -5 z"
          fill="#f5b301"/>
    <path d="M186 168 c1.5 -6 2 -6.5 3.5 -0.5 c0.5 2 1 2.5 3 3 c5.5 1.5 5.5 2 0 3.5 c-2 0.5 -2.5 1 -3 3 c-1.5 6 -2 6 -3.5 0 c-0.5 -2 -1 -2.5 -3 -3 c-5.5 -1.5 -5.5 -2 0 -3.5 c2 -0.5 2.5 -1 3 -2.5 z"
          fill="#f5b301" opacity="0.8"/>
  </g>

  <!-- wordmark -->
  <text x="276" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#1f2328">Everything Markdown</text>
  <text x="278" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" fill="#57606a">Local-first Markdown workspace for Firefox — one-click Gemini conversation export</text>

  <!-- chips -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#57606a">
    <rect x="278" y="222" width="118" height="30" rx="15" fill="#ffffff" stroke="#d0d7de"/>
    <text x="337" y="242" text-anchor="middle">Manifest V3</text>
    <rect x="406" y="222" width="104" height="30" rx="15" fill="#ffffff" stroke="#d0d7de"/>
    <text x="458" y="242" text-anchor="middle">Local-first</text>
    <rect x="520" y="222" width="118" height="30" rx="15" fill="#ffffff" stroke="#d0d7de"/>
    <text x="579" y="242" text-anchor="middle">No telemetry</text>
  </g>
</svg>
